<title>MT5 Monitor — 4 Akun</title>

<style>
  :root{
    --bg:#080b12; --bg2:#0d1220; --card:#111828; --card2:#0e1524;
    --line:#1e2739; --line2:#28334a;
    --txt:#eef3ff; --muted:#a7b6d1; --muted2:#8595b3;
    --up:#2ee59d; --down:#ff5c6c; --warn:#ffb020; --accent:#38bdf8;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background: radial-gradient(1100px 600px at 10% -10%, #12203a 0%, transparent 55%), radial-gradient(900px 500px at 95% 0%, #16283a 0%, transparent 50%), var(--bg);
    color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; padding:18px 18px 80px;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .mut{color:var(--muted)}
  .wrap{max-width:1400px;margin:0 auto}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#1b3a5c,#0d1a2b);border:1px solid #23405e;display:grid;place-items:center}
  .logo svg{width:20px;height:20px}
  .brand h1{font-size:17px;margin:0;font-weight:650}
  .brand p{margin:2px 0 0;font-size:11.5px;color:var(--muted2);letter-spacing:.4px;text-transform:uppercase}
  
  .pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:100px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted2)}
  .pill.on{border-color:#1d4b3a;background:#0c2018;color:#5eead4}
  .pill.on .dot{background:var(--up);box-shadow:0 0 0 3px rgba(46,229,157,.15)}
  .pill.off{border-color:#4d1f26;background:#200d11;color:#ff8b97}
  .pill.off .dot{background:var(--down)}
  .pill.wait{border-color:#4a3a12;background:#1d1608;color:#ffc860}
  .pill.wait .dot{background:var(--warn)}
  
  .btn{border:1px solid var(--line2);background:var(--card);color:var(--txt);padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:hover{background:#182238;border-color:#37456a}
  .btn.primary{background:linear-gradient(180deg,#0e7490,#0b5c74);border-color:#0e7490;color:#ecfeff}
  .btn.primary:hover{filter:brightness(1.12)}
  .btn.ghost{background:transparent}

  .summary{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:13px;margin-bottom:12px}
  .tile{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
  .tile:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,#2b3c5c,transparent)}
  .tile .lbl{font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted2);font-weight:700}
  .tile .val{font-size:25px;font-weight:750;margin-top:7px;letter-spacing:-.4px}
  .tile .sub{font-size:12.5px;color:var(--muted);margin-top:6px}

  .accounts{display:grid;grid-template-columns:repeat(auto-fit,minmax(278px,1fr));gap:13px;margin-bottom:20px}
  .card{background:linear-gradient(180deg,var(--card),#0c1322);border:1px solid var(--line);border-radius:15px;padding:15px 16px 12px;box-shadow:var(--shadow);position:relative;transition:.2s}
  .card:hover{border-color:var(--line2);transform:translateY(-1px)}
  .card.stale{border-color:#4a3a12}
  .card.dead{border-color:#4d1f26;opacity:.85}
  
  .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ch h3{margin:0;font-size:16.5px;font-weight:750;color:#f4f8ff}
  .ch .meta{font-size:12.5px;color:var(--muted2);margin-top:5px}
  .name-row{display:flex;align-items:center;gap:9px;min-width:0}
  
  .st{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:100px;font-size:11.5px;font-weight:800;letter-spacing:.9px;border:1px solid;flex:none;line-height:1}
  .st i{width:8px;height:8px;border-radius:50%;display:block;flex:none}
  .st.on{color:#6ff2c4;background:#07281e;border-color:#1f7d5c}
  .st.on i{background:#2ee59d;animation:pulse 2s ease-out infinite}
  .st.pause{color:#ffd27a;background:#2a1e06;border-color:#7d5f18}
  .st.pause i{background:#ffb020}
  .st.off{color:#ffa3ac;background:#2b0b11;border-color:#8a2b36}
  .st.off i{background:#ff5c6c}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,229,157,.55)}70%{box-shadow:0 0 0 6px rgba(46,229,157,0)}100%{box-shadow:0 0 0 0 rgba(46,229,157,0)}}

  .per{border-top:1px solid var(--line);margin-top:11px;padding-top:8px}
  .per .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:3.5px 0}
  .per .row span{color:var(--muted);font-size:12.5px;font-weight:600}
  .per .row b{font-size:15px;font-weight:750}

  .bal{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 10px;gap:8px}
  .bal .b1{font-size:26px;font-weight:750}
  .bal .b1 small{font-size:11px;color:var(--muted);font-weight:600;margin-left:4px}
  .flt{text-align:right}
  .flt .l{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted2);font-weight:700}
  .flt .v{font-size:16.5px;font-weight:750;margin-top:3px}

  .kvs{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
  .kv{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:6px}
  .kv span{color:var(--muted)}
  .kv b{font-weight:700;color:#eef3ff}

  .panel{background:linear-gradient(180deg,var(--card),#0b1120);border:1px solid var(--line);border-radius:15px;overflow:hidden}
  .ph{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ph h2{margin:0;font-size:14px;font-weight:650}
  .ph .count{font-size:12px;color:var(--muted);background:#0b1626;border:1px solid var(--line2);padding:2px 8px;border-radius:100px;font-weight:650}
  .ph .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{position:sticky;top:0;background:#0d1526;color:var(--muted2);font-size:11px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  tbody td{padding:10px 12px;border-bottom:1px solid #131b2b}
  tbody tr:hover{background:#0f1a2c}
  .side{font-size:11px;font-weight:800;padding:3px 8px;border-radius:5px;letter-spacing:.4px}
  .side.buy{color:#062b1d;background:#2ee59d}
  .side.sell{color:#2b060c;background:#ff5c6c}

  .banner{background:linear-gradient(180deg,#141d30,#0e1524);border:1px solid #24405f;border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .banner h2{margin:0 0 6px;font-size:15.5px}
  .banner p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.6}
  .banner code{background:#0b1626;border:1px solid var(--line2);padding:1.5px 6px;border-radius:5px;font-size:12px;color:#9fd4ff}

  .modal{position:fixed;inset:0;background:rgba(3,6,12,.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
  .modal.show{display:flex}
  .sheet{background:linear-gradient(180deg,#121a2b,#0c1322);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  .sheet-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .sheet-h h3{margin:0;font-size:15px}
  .sheet-b{padding:18px 20px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-bottom:6px}
  .field input,.field select{width:100%;background:#0a1220;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:13px;font-family:inherit;outline:none}
  .field input:focus{border-color:var(--accent)}
  .field .hint{font-size:11px;color:var(--muted2);margin-top:5px}
  .sheet-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
  
  .testres{font-size:12px;padding:9px 12px;border-radius:9px;margin-bottom:14px;display:none}
  .testres.ok{display:block;background:#0c2018;border:1px solid #1d4b3a;color:#5eead4}
  .testres.bad{display:block;background:#200d11;border:1px solid #4d1f26;color:#ffb3ba}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#132033;border:1px solid var(--line2);color:var(--txt);padding:11px 18px;border-radius:11px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Install Button */
  .install-btn {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #00c853, #009624); color: white; border: none;
    padding: 14px 28px; border-radius: 50px; font-size: 15px; font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,200,83,0.4); z-index: 999; cursor: pointer; display: none;
  }

  @media (max-width:860px){
    .summary{grid-template-columns:1fr 1fr}
    .tile .val{font-size:20px}
    body{padding:14px 12px 80px}
    .hide-sm{display:none}
